# Copy to inventory.ini and fill in per site. Secrets: use `ansible-vault`.
# Windows over WinRM-HTTPS (run bootstrap-winrm.ps1 on each host first).

[windows]
site1-hmi   ansible_host=192.168.1.50
site1-scada ansible_host=192.168.1.51

[windows:vars]
ansible_connection = winrm
ansible_port = 5986
ansible_winrm_transport = basic
ansible_winrm_server_cert_validation = ignore
ansible_user = Administrator
; ansible_password stored via vault:  ansible-vault encrypt_string --name ansible_password 'PW'

[mac]
site1-mini  ansible_host=192.168.1.60 ansible_user=admin

[mac:vars]
ansible_connection = ssh
ansible_python_interpreter = /usr/bin/python3
